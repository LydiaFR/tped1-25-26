<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galería con flex (versión comentada)</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <main class="container">
    <h1>Galería </h1>
    <h2>lydia franco rojo</h2>

    <div class="row">
      <figure class="item">
        <a href="img_html/billetes.html" class="link-item">
          <img src="img/billetes.png" alt="billetes" title="billetes">
          <figcaption>
            <strong>Billetes</strong>
            <span class="small">lo que nunca sobra</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/boxeo.html" class="link-item">
            <img src="img/boxeo.png" alt="boxeo" title="guantes de boxeo">
          <figcaption>
            <strong>La vida</strong>
            <span class="small">una batalla</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/cigarros.html" class="link-item">
             <img src="img/cigarros.png" alt="cigarros" title="cigarros">
          <figcaption>
            <strong>Fuma</strong>
            <span class="small">el sabor de las malas decisiones </span>
          </figcaption>
        </a>
      </figure>
    </div>


    <div class="row">

      <figure class="item">
        <a href="img_html/labios.html" class="link-item">
           <img src="img/labios.png" alt="dientes" title="dientes de oro">
          <figcaption>
            <strong>Dientes</strong>
            <span class="small">sonrisa de oro</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/gif.html" class="link-item">
         <img src="img/gif.gif" alt="patriarcado" title="dientes de oro">
          <figcaption>
            <strong>Nos silencian</strong>
            <span class="small">no voy a bajar la voz</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/megafono.html" class="link-item">
          <img src="img/Megafono.png" alt="magafono" title="megafono">
          <figcaption>
            <strong>Grito</strong>
            <span class="small">por si no me oyen</span>
          </figcaption>
        </a>
      </figure>
    </div>



    <div class="row">

      <figure class="item">
        <a href="img_html/puño.html" class="link-item">
        <img src="img/Puño.png" alt="puño" title="puño cerrado">
          <figcaption>
            <strong>Power</strong>
            <span class="small">elegante pero firme</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/tecla.html" class="link-item">
            <img src="img/Tecla.png" alt="tecla" title="tecla escape">
          <figcaption>
            <strong>Escape</strong>
            <span class="small">no funciona</span>
          </figcaption>
        </a>
      </figure>

      <figure class="item">
        <a href="img_html/pantone.html" class="link-item">
            <img src="img/pantone.png" alt="pantone" title="pantone imperfecto">
          <figcaption>
            <strong>Imperfecto</strong>
            <span class="small">tambien vale</span>
          </figcaption>
        </a>
      </figure>
    </div>
  </main>


</body>
</html>
